[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opsguard"
version = "0.1.0"
description = "Catch the change before it breaks production. OpsGuard detects dangerous infrastructure changes in pull requests before they reach production."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "OpsGuard Contributors" }]
keywords = [
    "devops",
    "kubernetes",
    "terraform",
    "security",
    "ci-cd",
    "infrastructure",
    "policy-as-code",
    "risk-analysis",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Security",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "PyYAML>=6.0",
    "networkx>=3.1",
    "typer>=0.9.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
ai = ["requests>=2.31.0"]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "requests>=2.31.0",
    "ruff>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/mehwish786jnc/OpsGuard"
Repository = "https://github.com/mehwish786jnc/OpsGuard"
Issues = "https://github.com/mehwish786jnc/OpsGuard/issues"
Documentation = "https://github.com/mehwish786jnc/OpsGuard#readme"

[project.scripts]
opsguard = "opsguard.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
opsguard = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "C4", "SIM"]
ignore = ["E501", "B008", "SIM105"]
