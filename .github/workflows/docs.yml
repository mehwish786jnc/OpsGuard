name: Site

# Builds the marketing landing page (web/) and the MkDocs docs, then deploys
# them together to GitHub Pages as a single site:
#   /        → landing page (web/)
#   /docs/   → documentation (MkDocs Material)
#
# Enable once in the repo: Settings → Pages → Build and deployment → Source:
# "GitHub Actions".
on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "docs/**"
      - "mkdocs.yml"
      - "README.md"
      - "CONTRIBUTING.md"
      - "CHANGELOG.md"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[docs]"

      - name: Assemble site (landing at /, docs at /docs)
        run: |
          rm -rf public
          mkdir -p public
          cp -R web/. public/
          mkdocs build --strict -d public/docs

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
