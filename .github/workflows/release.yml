name: Release

# Publishes OpsGuard to PyPI when a version tag (e.g. v0.1.0) is pushed, and
# creates a matching GitHub Release.
#
# Uses PyPI Trusted Publishing (OIDC) — no API tokens or secrets to manage.
# One-time setup on PyPI:
#   1. Create the project (or reserve the name by uploading 0.1.0 manually once).
#   2. PyPI → your project → Publishing → add a "pending publisher":
#        Owner:        mehwish786jnc
#        Repository:   OpsGuard
#        Workflow:     release.yml
#        Environment:  pypi
#
# Then: bump the version in pyproject.toml, tag and push:
#   git tag v0.1.0 && git push origin v0.1.0

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Check metadata
        run: |
          pip install twine
          twine check dist/*

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/opsguard
    permissions:
      id-token: write # required for trusted publishing
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: Create GitHub Release
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: dist/*
