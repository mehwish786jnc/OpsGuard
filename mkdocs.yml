site_name: OpsGuard
site_description: Catch the change before it breaks production. Production change intelligence for Kubernetes & Terraform.
site_url: https://mehwish786jnc.github.io/OpsGuard/docs/
repo_url: https://github.com/mehwish786jnc/OpsGuard
repo_name: mehwish786jnc/OpsGuard
edit_uri: edit/main/docs/
copyright: Apache-2.0 licensed · Built by the OpsGuard contributors

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/logo.svg
  font:
    text: Inter
  icon:
    repo: fontawesome/brands/github
  palette:
    - scheme: slate
      primary: black
      accent: blue
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.instant
    - navigation.tracking
    - content.code.copy
    - content.code.annotate
    - toc.follow
    - search.suggest
    - search.highlight

extra_css:
  - stylesheets/opsguard.css

extra:
  # Clicking the header logo/title (and the "Landing" tab) leaves the docs and
  # returns to the marketing landing page. Defaults to the deployed Pages URL;
  # override for local preview, e.g. OPSGUARD_HOMEPAGE=http://localhost:8080/
  homepage: !ENV [OPSGUARD_HOMEPAGE, "https://mehwish786jnc.github.io/OpsGuard/"]

plugins:
  - search
  - include-markdown

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Guide:
      - Installation: installation.md
      - Usage: usage.md
      - GitHub Action: github-action.md
  - Reference:
      - Rules: rules.md
      - AI explanations: ai.md
      - Architecture: architecture.md
  - Project:
      - Contributing: contributing.md
      - Changelog: changelog.md
  - Landing ↗: !ENV [OPSGUARD_HOMEPAGE, "https://mehwish786jnc.github.io/OpsGuard/"]
