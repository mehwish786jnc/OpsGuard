apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-web
  labels:
    app: {{ .Release.Name }}-web
spec:
  replicas: {{ .Values.replicaCount }}        # K8S-REL-003 when 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}-web
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-web
    spec:
      containers:
        - name: web
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"  # K8S-IMG-001 on :latest
          ports:
            - containerPort: 8080
          securityContext:
            privileged: {{ .Values.privileged }}    # K8S-SEC-001 (CRITICAL)
          # K8S-REL-001: no probes; K8S-REL-002: no resource requests/limits
